[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cardioclaw"
version = "5.0.0a1"
description = "Podcast-first, automated nuclear cardiology audio briefings"
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [
  { name = "Steve Zoloth" },
  { name = "Sam Zoloth" }
]
dependencies = [
  "anthropic>=1.2,<2",
  "biopython>=1.88,<2",
  "feedparser>=6.0.14,<7",
  "flask>=3.1,<4",
  "gunicorn>=23,<24",
  "mutagen>=1.47,<2",
  "openai>=3.5,<4",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.9,<3",
  "python-dotenv>=1.1,<2"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1"
]

[project.scripts]
cardioclaw = "cardioclaw.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["cardioclaw"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP", "SIM", "RUF"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
branch = true
source = ["cardioclaw"]

[tool.coverage.report]
show_missing = true
fail_under = 75
