name: CI

on:
  pull_request:
  push:
    branches: [main, "feat/**", "fix/**", "chore/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q cardioclaw cardio_claw.py serve.py
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest --cov=cardioclaw --cov-report=term-missing --cov-fail-under=75
      - name: CLI smoke test
        run: cardioclaw --help

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -t cardioclaw-ci .
      - name: Validate Compose
        run: cp .env.example .env && docker compose config --quiet
