services:
  cardioclaw:
    build: .
    env_file:
      - .env
    environment:
      CARDIOCLAW_DATA_DIR: /data
      CARDIOCLAW_COVER_PATH: /app/cover.png
      CARDIOCLAW_SERVER_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - cardioclaw-data:/data
    restart: unless-stopped

volumes:
  cardioclaw-data:
